[project]
name = "lean-voice"
version = "0.1.0"
description = "Voice-first Lean environment: work on proofs with Claude Code by voice"
readme = "README.md"
authors = [
    { email = "ty@tytr.dev" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.7",
    "parakeet-mlx>=0.7.0",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
